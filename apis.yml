name: Senken
description: 'Senken (Senken GmbH, Berlin) is a carbon credit procurement marketplace
  and advisory for European enterprises. It curates high-integrity carbon credits by
  scoring climate projects across 600+ data points with its Sustainability Integrity
  Index (SII), aligned to the Oxford Offsetting Principles and ICVCM Core Carbon Principles,
  rejecting roughly 95% of available credits. Products span advisory (CSRD, SBTi, CDP
  compliance), vetted procurement, audit-ready documentation (Champion''s Kit), the
  SBTi 2035 Reserve carbon-removal supply, an OER portfolio, and free self-serve tools
  at tools.senken.io (checkout, portfolio calculator, OER calculator, EU greenwashing
  auditor). Clients include Vodafone, Deutsche Telekom, DZ Bank, and Union Investment.
  No public developer API is published as of this enrichment pass.'
